# ============================================================
#  reg-log backend app  -  Spring Boot + MySQL configuration
#  Every value can be overridden with an environment variable,
#  which is what the AWS deployment does.
# ============================================================
server.port=${SERVER_PORT:8080}
spring.application.name=reg-log-backend-app

# ---------- MySQL DataSource ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:reglog_ecommerce}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:reglog}
spring.datasource.password=${DB_PASSWORD:reglog@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:reg-log-backend-app-super-secret-key-change-me-in-production-0123456789}
app.jwt.issuer=${JWT_ISSUER:reg-log-backend-app}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS (dev) ----------
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173}

logging.level.com.reglog=INFO
logging.level.org.springframework.security=INFO
